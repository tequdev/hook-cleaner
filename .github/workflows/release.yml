name: Build and Release

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_name: linux
            arch: x64
            libc: gnu
            asset: hook-cleaner-linux-x64-gnu
            name: linux-x64-gnu
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            libc: gnu
            asset: hook-cleaner-linux-arm64-gnu
            name: linux-arm64-gnu
          - os: macos-15-intel
            os_name: macos
            arch: x64
            libc: ''
            asset: hook-cleaner-macos-x64
            name: macos-x64
          - os: macos-15
            os_name: macos
            arch: arm64
            libc: ''
            asset: hook-cleaner-macos-arm64
            name: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential wabt binutils file

      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install wabt coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build binary
        run: make

      - name: Run tests
        working-directory: tests
        run: ./run-all.sh

      - name: Rename binary
        run: mv hook-cleaner "${{ matrix.asset }}"

      - name: Verify binary architecture
        run: ./.github/scripts/check-binary-arch.sh "${{ matrix.asset }}" "${{ matrix.os_name }}" "${{ matrix.arch }}" "${{ matrix.libc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  build-musl:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_name: linux
            arch: x64
            libc: musl
            asset: hook-cleaner-linux-x64-musl
            name: linux-x64-musl
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            libc: musl
            asset: hook-cleaner-linux-arm64-musl
            name: linux-arm64-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build musl binary in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -eu
            apk add --no-cache build-base file binutils
            make
            ./hook-cleaner tests/accept.wasm /tmp/t.wasm
          '

      - name: Fix binary ownership
        run: sudo chown "$(id -u):$(id -g)" hook-cleaner

      - name: Rename binary
        run: mv hook-cleaner "${{ matrix.asset }}"

      - name: Verify binary architecture
        run: |
          if ! command -v file >/dev/null 2>&1 || ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils file
          fi
          ./.github/scripts/check-binary-arch.sh "${{ matrix.asset }}" "${{ matrix.os_name }}" "${{ matrix.arch }}" "${{ matrix.libc }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  build-wasi:
    name: wasm32-wasi
    runs-on: ubuntu-24.04
    env:
      WASI_SDK_VERSION: '34'
      WASMTIME_VERSION: v49.0.2
      ASSET: hook-cleaner-wasm32-wasi.wasm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wabt file
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Build wasm binary
        run: make CC="$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux/bin/clang" && mv hook-cleaner "$ASSET"

      - name: Run tests
        working-directory: tests
        run: HOOKCLEANER="wasmtime run --dir=. --dir=/tmp ../$ASSET" ./run-all.sh

      - name: Verify binary format
        run: file "$ASSET" | grep WebAssembly

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 1

  create-release:
    needs: [build, build-musl, build-wasi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
